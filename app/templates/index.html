
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #212121;
            --surface: #2f2f2f;
            --surface-hover: #383838;
            --border: #414141;
            --text: #ececec;
            --muted: #999999;
            --accent: #ffffff;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .app {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--background);
        }

        /* HEADER */

        header {
            width: 100%;
            padding: 17px 28px;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0;
        }

        header p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
            font-weight: 400;
        }

        /* CHAT */

        #chat {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 25px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #555555;
            border-radius: 10px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        /* MESSAGES */

        .message {
            margin-bottom: 22px;
            max-width: 85%;
            padding: 13px 17px;
            border-radius: 18px;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 15px;
            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* USER MESSAGE */

        .user {
            margin-left: auto;
            background: #303030;
            color: var(--text);
            border: 1px solid #414141;
            border-radius: 18px;
        }

        /* AI MESSAGE */

        .assistant {
            margin-right: auto;
            background: transparent;
            color: var(--text);
            border: none;
            padding-left: 0;
            padding-right: 0;
        }

        /* SOURCES */

        .sources {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }

        .sources strong {
            color: #d4d4d4;
            font-weight: 600;
        }

        .sources div {
            margin-top: 6px;
            line-height: 1.5;
        }

        /* TYPING INDICATOR */

        .typing {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 18px;
            animation: pulse 1.3s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* INPUT AREA */

        .input-area {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            padding: 15px 25px 22px;
            flex-shrink: 0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 15px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #888888;
        }

        input:focus {
            border-color: #777777;
        }

        /* SEND BUTTON */

        button {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ececec;
            border: none;
            border-radius: 50%;
            color: #212121;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover:not(:disabled) {
            background: #ffffff;
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button svg {
            width: 21px;
            height: 21px;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            header {
                padding: 15px 18px;
            }

            header h1 {
                font-size: 19px;
            }

            #chat {
                padding: 22px 16px;
            }

            .message {
                max-width: 94%;
                font-size: 14px;
            }

            .input-area {
                padding: 12px 14px 16px;
                gap: 8px;
            }

            input {
                padding: 13px 14px;
                font-size: 14px;
            }

            button {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>
        <h1>AI Assistant</h1>
        <p>Powered by Qwen3:1.7b</p>
    </header>

    <!-- CHAT -->

    <main id="chat">

        <div class="message assistant">
            Привет! Я AI Assistant.

            Задай свой вопрос, и я постараюсь найти
            точный ответ в доступной базе знаний.
        </div>

    </main>

    <!-- INPUT -->

    <form class="input-area" id="chat-form">

        <input
            type="text"
            id="question"
            placeholder="Напишите сообщение..."
            autocomplete="off"
            required
        >

        <button type="submit" id="send-button" aria-label="Отправить">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 19V5"></path>
                <path d="M5 12l7-7 7 7"></path>
            </svg>
        </button>

    </form>

</div>

<script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const button = document.getElementById("send-button");

    function addMessage(text, type, sources = []) {
        const message = document.createElement("div");
        message.className = `message ${type}`;

        const content = document.createElement("div");
        content.textContent = text;
        message.appendChild(content);

        if (sources.length > 0) {
            const sourceBlock = document.createElement("div");
            sourceBlock.className = "sources";

            const title = document.createElement("strong");
            title.textContent = "Источники:";
            sourceBlock.appendChild(title);

            sources.forEach(source => {
                const item = document.createElement("div");

                item.textContent =
                    `${source.document_id} · ${source.department} · ` +
                    `${source.document_title}`;

                sourceBlock.appendChild(item);
            });

            message.appendChild(sourceBlock);
        }

        chat.appendChild(message);
        chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const question = input.value.trim();

        if (!question) return;

        addMessage(question, "user");

        input.value = "";
        button.disabled = true;

        const typing = document.createElement("div");
        typing.className = "typing";
        typing.textContent = "AI Assistant думает...";

        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ question })
            });

            const data = await response.json();

            typing.remove();

            if (!response.ok) {
                throw new Error(data.error || "Ошибка сервера");
            }

            addMessage(
                data.answer,
                "assistant",
                data.sources || []
            );

        } catch (error) {
            typing.remove();

            addMessage(
                "Ошибка: " + error.message,
                "assistant"
            );

        } finally {
            button.disabled = false;
            input.focus();
        }
    });
</script>

</body>
</html>
